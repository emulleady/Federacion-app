{% extends "federacion_app/base.html" %}
{% block content %}
<div class="card" style="max-width:360px; margin:60px auto;">
  <h2>Ingresar</h2>
  {% if form.errors %}
    <p style="color:#b91c1c; font-size:14px;">Usuario o contraseña incorrectos.</p>
  {% endif %}
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Ingresar</button>
    <input type="hidden" name="next" value="{{ next }}">
  </form>
</div>
{% endblock %}
