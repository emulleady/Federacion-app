{% extends "federacion_app/base.html" %}
{% block content %}
<div class="card">
  <h2>Cargar tarjeta</h2>
  <form method="get" style="margin-bottom:16px; max-width:300px;">
    <label>Club</label>
    <select name="club" onchange="this.form.submit()">
      <option value="">— Seleccionar —</option>
      {% for c in clubes %}
        <option value="{{ c.id }}" {% if club_elegido.id == c.id %}selected{% endif %}>{{ c.nombre }}</option>
      {% endfor %}
    </select>
  </form>

  {% if club_elegido %}
  <form method="post">
    {% csrf_token %}
    <input type="hidden" name="accion" value="cargar">
    <input type="hidden" name="club" value="{{ club_elegido.id }}">
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:14px; max-width:600px;">
      <div>
        <label>Jugador</label>
        <select name="persona" required>
          <option value="">— Seleccionar —</option>
          {% for p in jugadores %}
            <option value="{{ p.id }}">{{ p.apellido }}, {{ p.nombre }}</option>
          {% endfor %}
        </select>
      </div>
      <div>
        <label>Tipo de tarjeta</label>
        <select name="tipo" required>
          <option value="amarilla">Amarilla</option>
          <option value="azul_indirecta">Azul indirecta</option>
          <option value="azul_directa">Azul directa</option>
        </select>
      </div>
      <div>
        <label>Fecha del partido</label>
        <input type="date" name="fecha_partido" required>
      </div>
      <div>
        <label>Torneo (opcional)</label>
        <select name="torneo">
          <option value="">—</option>
          {% for t in torneos %}<option value="{{ t.id }}">{{ t }}</option>{% endfor %}
        </select>
      </div>
      <div style="grid-column: span 2;">
        <label>Observación (opcional)</label>
        <input type="text" name="observacion" placeholder="Ej: doble amonestación">
      </div>
    </div>
    <button type="submit" style="margin-top:16px;">Cargar tarjeta</button>
  </form>
  {% endif %}
</div>
{% endblock %}
